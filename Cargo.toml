[package]
name = "nfse"
version = "0.1.0"
edition = "2024"

[lib]
name = "nfse"
path = "src/lib.rs"

[[bin]]
name = "nfse"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.10", features = ["derive"] }
cryptoki = "0.12.1"
cryptoki-sys = "0.5"
env_logger = { version = "0.11.12", default-features = false, features = ["auto-color", "humantime"] }
flate2 = "1.1.11"
foreign-types = "0.3"
hex = "0.4.3"
libloading = "0.9.1"
log = "0.4.35"
openssl = "0.10.82"
openssl-sys = "0.9.118"
quick-xml = "0.42.0"
rpassword = "7.5.5"
serde_json = "1.0.154"
sha2 = "0.11.2"
x509-parser = "0.18.1"

[dev-dependencies]
foreign-types = "0.3"
openssl-sys = "0.9.118"
tempfile = "3.27.0"
